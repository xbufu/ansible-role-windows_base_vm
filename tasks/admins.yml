---
# Local passwords expire after 42 days by default. Group by SID, so it works in every language.
- name: Disable password expiration for local Administrator accounts
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false
      $admins = Get-LocalGroupMember -SID S-1-5-32-544 |
        Where-Object { $_.ObjectClass -eq 'User' -and $_.PrincipalSource -eq 'Local' }
      foreach ($admin in $admins) {
        $user = Get-LocalUser -SID $admin.SID
        if ($user.PasswordExpires) {
          Set-LocalUser -SID $admin.SID -PasswordNeverExpires $true
          $Ansible.Changed = $true
        }
      }
