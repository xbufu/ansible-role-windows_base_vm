---
- name: Firewall rule to allow ICMP v4 echo (ping)
  community.windows.win_firewall_rule:
    name: ICMP Allow incoming V4 echo request
    enabled: true
    state: present
    # Clones start on a Public network after sysprep.
    profiles: [domain, private, public]
    action: allow
    direction: in
    protocol: icmpv4
    icmp_type_code:
      - '8:*'
